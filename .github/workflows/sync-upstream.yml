name: sync-upstream

# Weekly automatic merge of the latest ollama/ollama main into this repo.
# Creates/updates a `sync/upstream` branch, opens a pull request back to main,
# and (if auto-merge is enabled) merges it once the Windows build passes.
#
# Fork note: GitHub Actions must first be enabled in the fork's Actions tab.
# Pull request creation uses the REST API. This avoids the GraphQL createPullRequest
# path used by `gh pr create`, which is rejected for this fork's workflow token.
#
# Run it manually any time from Actions -> Sync upstream -> Run workflow.

on:
  schedule:
    - cron: "0 0 * * 1"   # every Monday 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Disable upstream workflows that need org secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for wf in latest.yaml release.yaml; do
            if gh workflow disable "$wf" 2>/dev/null; then
              echo "Disabled upstream workflow: $wf"
            else
              echo "Could not disable $wf; if it appears in the Actions tab, disable it manually."
            fi
          done

      - name: Fetch and merge upstream
        id: merge
        run: |
          echo "changed=false" >> "$GITHUB_OUTPUT"
          git remote add upstream https://github.com/ollama/ollama.git
          git fetch upstream main
          git checkout -B sync/upstream origin/main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "No new upstream commits since the last sync."
            exit 0
          fi

          # Merge first, but keep repository-owned files exactly as they were on
          # main. In particular, do not push upstream workflow changes with the
          # GITHUB_TOKEN: GitHub App tokens need the Workflows permission to
          # create or update files under .github/workflows.
          merge_had_conflicts=false
          if ! git merge --no-edit upstream/main; then
            merge_had_conflicts=true
          fi

          git restore --source=origin/main --staged --worktree -- README.md .github/workflows

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "::error::Upstream merge has conflicts outside repository-owned README/workflow files:"
            printf '%s\n' "$unresolved"
            exit 1
          fi

          if [ "$merge_had_conflicts" = "true" ]; then
            git commit --no-edit
          elif ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push sync branch
        if: steps.merge.outputs.changed == 'true'
        run: git push --force-with-lease origin sync/upstream

      - name: Open or update pull request
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_pr="$(gh api "/repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&head=$GITHUB_REPOSITORY_OWNER:sync/upstream" --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            echo "Pull request #$existing_pr already exists; branch update is sufficient."
          else
            gh api --method POST "/repos/$GITHUB_REPOSITORY/pulls" \
              -f title="chore: sync upstream ollama/ollama" \
              -f head="sync/upstream" \
              -f base="main" \
              -f body="Automatically merged the latest ollama/ollama main into this branch. The Windows build runs on this PR."
          fi

      - name: Enable auto-merge on the PR
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge sync/upstream --auto --merge || \
            echo "Auto-merge is not enabled for this repo; review and merge the PR manually."
